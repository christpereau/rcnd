<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R.C.N.D. — Accueil</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --deep:#07111f;--navy:#0b1d30;--hull:#112840;--wake:#163557;--tide:#1e4a75;
  --oar:#2e6ca4;--spray:#4a9fd4;--gold:#d4a843;--gold2:#f0c870;
  --coral:#e05c3a;--green:#2eb87a;--text:#ddeaf7;--muted:#6a8fad;--border:#1e3a55;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body {
  font-family:"Source Sans 3",sans-serif;
  background:var(--deep);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
body::before {
  content:"";position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 50% at 15% 85%, rgba(30,74,117,.25) 0%, transparent 55%),
    radial-gradient(ellipse 60% 40% at 85% 15%, rgba(46,108,164,.15) 0%, transparent 50%);
  pointer-events:none;
}
body::after {
  content:"";position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(46,108,164,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(46,108,164,.04) 1px, transparent 1px);
  background-size:40px 40px;pointer-events:none;
}
.waves{position:fixed;bottom:0;left:0;width:100%;height:120px;opacity:.18;pointer-events:none;}
.container {
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;
  padding:32px 20px;width:100%;max-width:520px;
  animation:fadeUp .7s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.header{text-align:center;margin-bottom:36px;}
.logo-icon {
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 10px;
  filter:drop-shadow(0 4px 20px rgba(43,0,255,.25)) drop-shadow(0 2px 6px rgba(0,0,0,.5));
}
.logo-icon svg{
  background:rgba(255,255,255,0.07);
  border-radius:50%;padding:10px;
}
.divider{width:48px;height:2px;background:linear-gradient(90deg,transparent,var(--oar),transparent);margin:14px auto 0;}
.cards{display:flex;flex-direction:column;gap:14px;width:100%;}
.card {
  display:block;background:var(--navy);border:1px solid var(--border);
  border-radius:14px;padding:22px 24px;text-decoration:none;color:var(--text);
  position:relative;overflow:hidden;cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
  animation:fadeUp .7s ease both;
}
.card:nth-child(1){animation-delay:.1s}
.card:nth-child(2){animation-delay:.2s}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;opacity:.7;}
.card.entrainement::before{background:linear-gradient(90deg,var(--oar),var(--spray),transparent);}
.card.regate::before{background:linear-gradient(90deg,var(--gold),var(--gold2),transparent);}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 48px rgba(0,0,0,.35);}
.card.entrainement:hover{border-color:var(--spray);}
.card.regate:hover{border-color:var(--gold);}
.card::after{content:"";position:absolute;inset:0;border-radius:14px;opacity:0;transition:opacity .3s;pointer-events:none;}
.card.entrainement::after{background:radial-gradient(ellipse 80% 60% at 50% 120%,rgba(74,159,212,.08),transparent);}
.card.regate::after{background:radial-gradient(ellipse 80% 60% at 50% 120%,rgba(212,168,67,.08),transparent);}
.card:hover::after{opacity:1;}
.card-inner{display:flex;align-items:center;gap:18px;position:relative;z-index:1;}
.card-icon{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.entrainement .card-icon{background:rgba(46,108,164,.2);border:1px solid rgba(74,159,212,.25);}
.regate .card-icon{background:rgba(212,168,67,.15);border:1px solid rgba(212,168,67,.25);}
.card-text{flex:1;min-width:0;}
.card-title{font-family:"Playfair Display",serif;font-size:20px;font-weight:700;margin-bottom:4px;line-height:1.2;}
.entrainement .card-title{color:var(--spray);}
.regate .card-title{color:var(--gold);}
.card-desc{font-size:13px;color:var(--muted);font-weight:400;}
.card-arrow{font-size:20px;color:var(--border);flex-shrink:0;transition:transform .2s,color .2s;}
.card:hover .card-arrow{transform:translateX(4px);}
.entrainement:hover .card-arrow{color:var(--spray);}
.regate:hover .card-arrow{color:var(--gold);}
.footer{margin-top:28px;font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;opacity:.6;}
</style>
</head>
